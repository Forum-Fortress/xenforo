name: XenForo plugin CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: xenforo-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check PHP syntax and required license
        run: |
          test -s upload/src/addons/ForumFortress/Protect/LICENSE.txt
          find upload/src/addons/ForumFortress/Protect -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
